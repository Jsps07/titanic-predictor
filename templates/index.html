<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>
            Titanic Survival Predictor
        </title>
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <h1>Will you survive the titanic?</h1>
            <form method="post" class="card p-4 shadow">
                <label class="form-label">Passenger Class (1, 2, 3)</label>
                <input type="number" name="pclass" min="1" max="3" class="form-control" required?><br>

                <label class ="form-label">Sex</label>
                <select name = 'sex' class="form-select" required>
                    <option value="" disabled selected>Select Sex</option>
                    <option value="0">Female</option>
                    <option value="1">Male</option>
                </select><br>

                <label class="form-label">Age</label>
                <input type="number" min="0" step="any" name="age" class="form-control" required><br>

                <label class="form-label">Siblings/Spouses aboard (SibSp)</label>
                <input type="number" name="sibsp" min ="0" class= "form-control" required><br>

                <label class="form-label">Parents/Children aboard (Parch)</label>
                <input type="number" name="parch" min="0"class="form-control" required><br>

                <label class="form-label">Fare</label>
                <input type="number" step="any" min="0" name="fare" class="form-control" required><br>

                <label class="form-label">Embarked</label>
                <select name="embarked" class="form-select" required>
                    <option value="" disabled selected>Select Embarked Port</option>
                    <option value="0">Cherbourg (C)</option>
                    <option value="1">Queenstown (Q)</option>
                    <option value="2">Southampton (S)</option>
                </select><br>


                <button type="submit" class="btn btn-primary mt-3">Check Survival</button>
            </form>

            {%if prediction is not none%}
                <div class="alert {{ 'alert-success' if prediction == 1 else 'alert danger'}} mt-4 text-center">
                    <h4>{{ '🎉 Survived' if prediction == 1 else '💀 Did Not Survive' }}</h4>
                </div>
            {% endif %}
        </div>
    </body>
</html>
